name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'nginx/**'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'frontend/**'

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Build — runs on every push / PR
  # ────────────────────────────────────────────
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      artifact-name: ev-cluster-load-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build (mock mode for static host)
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'
          VITE_API_BASE_URL: ''
          # For GitHub Pages: set base path to repo name
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # ────────────────────────────────────────────
  # Deploy to GitHub Pages (main only)
  # ────────────────────────────────────────────
  deploy-github-pages:
    name: Deploy → GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────
  # Preview deploy for PRs (Cloudflare Pages)
  # ────────────────────────────────────────────
  preview-cloudflare:
    name: Preview → Cloudflare Pages
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build demo bundle
        run: npm run demo
        working-directory: frontend
        env:
          VITE_USE_MOCKS: 'true'
          VITE_API_BASE_URL: ''

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name ev-cluster-load --branch pr-${{ github.event.pull_request.number }}
        continue-on-error: true   # Don't fail PR if CF not configured

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview deployed!** [View preview](https://pr-${{ github.event.pull_request.number }}.ev-cluster-load.pages.dev)\n\n> Note: Uses fixture data (no backend required)'
            })
