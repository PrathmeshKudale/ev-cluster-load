name: lighthouse-ci

on:
  push:
    branches: [main, feat/f8-performance]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  lighthouse:
    name: Lighthouse CI (performance ≥ 90)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'
          VITE_API_BASE_URL: 'http://localhost:8000'

      - name: Report bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js dist/assets/*.css 2>/dev/null | sort -h >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL=$(du -sb dist | cut -f1)
          echo "Total dist: ${TOTAL} bytes ($(echo "scale=1; ${TOTAL}/1024/1024" | bc) MB)" >> $GITHUB_STEP_SUMMARY

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=../lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
