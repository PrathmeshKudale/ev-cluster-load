name: frontend-tests

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  # ──────────────────────────────────────────────
  # Unit + integration tests (Vitest + RTL + MSW)
  # ──────────────────────────────────────────────
  vitest:
    name: Vitest (unit/integration, coverage ≥ 70%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Run Vitest with coverage
        run: npx vitest run --coverage
        env:
          CI: 'true'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/

  # ──────────────────────────────────────────────
  # Playwright E2E (golden path + accessibility)
  # ──────────────────────────────────────────────
  playwright:
    name: Playwright E2E (golden path + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (mock mode)
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'
          VITE_API_BASE_URL: ''

      - name: Start preview server
        run: npx vite preview --port 5173 &
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright tests (golden path + axe)
        run: npx playwright test e2e/golden-path.spec.ts e2e/accessibility.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'
          CI: 'true'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
